[package]
name = "itsmypa"
version = "0.1.2"
description = "ItsMyPA — your private AI meeting PA"
edition = "2021"

[workspace]
members = [".", "engine", "capture"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
itsmypa-engine = { path = "engine" }
itsmypa-capture = { path = "capture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
