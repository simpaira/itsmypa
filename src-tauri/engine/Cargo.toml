[package]
name = "itsmypa-engine"
version = "0.1.2"
description = "ItsMyPA on-device engine: capture, transcription, diarization, local LLM"
edition = "2021"

[dependencies]
sherpa-onnx = "1.13.8"
hound = "3.5"
dirs = "6"
anyhow = "1"
ureq = "2.12"
sha2 = "0.10"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.158", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.158", default-features = false }
