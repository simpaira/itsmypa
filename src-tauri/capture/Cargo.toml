[package]
name = "itsmypa-capture"
version = "0.1.2"
description = "ItsMyPA native audio capture: microphone + computer audio (loopback) on macOS and Windows"
edition = "2021"

# Pure Rust (no C build step), so the Windows code can be type-checked from a
# Mac with `cargo check --target x86_64-pc-windows-msvc`.
[dependencies]
cpal = "0.18.2"
hound = "3.5"
anyhow = "1"
